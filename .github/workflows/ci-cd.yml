name: CI/CD

on:
  push:
    branches: [main, prod]
  pull_request:
    branches: [main, prod]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  # Deploy production tidak dibatalkan di tengah jalan.
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Samakan dengan image python:3.12-slim di Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (frontend + backend)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          no-cache: true

  deploy:
    name: Deploy ke VM
    needs: [backend-test, docker-build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan SSH key
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          if [ -z "$VM_HOST" ] || [ -z "$VM_SSH_KEY" ]; then
            echo "::error::Secret VM_HOST dan VM_SSH_KEY belum diisi di GitHub."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      - name: Tarik kode prod lalu rebuild container
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "deploy@$VM_HOST" bash -se <<'EOF'
          set -euo pipefail
          cd /srv/commercial
          git fetch --quiet origin prod
          git reset --hard origin/prod
          if ! docker compose up -d --build --wait --remove-orphans; then
            docker compose ps
            docker compose logs --tail 50 app
            exit 1
          fi
          docker image prune -f > /dev/null
          echo "Deploy berhasil: $(git rev-parse --short HEAD)"
          EOF
